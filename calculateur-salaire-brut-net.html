{
  "@context":"https://schema.org","@type":"FAQPage","inLanguage":"fr-FR",
  "mainEntity":[
    {"@type":"Question","name":"Comment calculer son salaire net a partir du brut en 2026 ?","acceptedAnswer":{"@type":"Answer","text":"On retranche du salaire brut les cotisations sociales salariales : vieillesse plafonnee 6,90 % sur la tranche 1, vieillesse deplafonnee 0,40 %, retraite complementaire AGIRC-ARRCO 3,15 % en tranche 1 et 8,64 % en tranche 2, CEG 0,86 % et 1,08 %, CET 0,14 % au-dela du plafond, APEC 0,024 % pour les cadres, et CSG-CRDS 9,70 % calculee sur 98,25 % du brut. Le total represente environ 21 % du brut."}},
    {"@type":"Question","name":"Combien fait 2000 euros brut en net ?","acceptedAnswer":{"@type":"Answer","text":"Un salaire de 2 000 euros brut par mois correspond a environ 1 583 euros net avant impot pour un salarie non-cadre du secteur prive en 2026, soit environ 79 % du brut. Pour 2 500 euros brut, comptez environ 1 979 euros net, et pour 3 000 euros brut environ 2 375 euros."}},
    {"@type":"Question","name":"Dans un contrat de 39 heures, les heures supplementaires demarrent-elles a 35 h ou a 39 h ?","acceptedAnswer":{"@type":"Answer","text":"A 35 heures dans l'immense majorite des cas. L'article L3121-27 du Code du travail fixe la duree legale a 35 heures, et il s'agit d'un seuil de declenchement, pas d'un maximum. Dans un contrat de 39 heures ordinaire, les 4 heures au-dela de 35 heures sont donc des heures supplementaires dites structurelles, dont la majoration d'au moins 25 % est obligatoire. Il existe toutefois une exception : les regimes d'equivalence, propres a certains secteurs comportant des periodes d'inaction. Dans le transport routier de marchandises, le seuil est de 43 heures par semaine pour les conducteurs longue distance et de 39 heures pour la courte distance et la messagerie. Les heures situees entre 35 heures et ce seuil sont des heures d'equivalence : payees, mais ni majorees, ni exonerees."}},
    {"@type":"Question","name":"Quel est le salaire net pour un contrat de 39 heures ?","acceptedAnswer":{"@type":"Answer","text":"Un contrat de 39 heures comporte 4 heures supplementaires par semaine, soit 17,33 heures par mois majorees de 25 %. Elles representent exactement 12,5 % du brut total. Ces heures beneficient d'une reduction de cotisations salariales de 11,31 % et d'une exoneration d'impot sur le revenu dans la limite de 7 500 euros nets par an, en application de l'article 81 quater du Code general des impots. A brut identique, un salarie a 39 heures conserve donc un peu plus de net qu'un salarie a 35 heures."}},
    {"@type":"Question","name":"Comment calculer le brut a partir du net ?","acceptedAnswer":{"@type":"Answer","text":"Il n'existe pas de formule directe, car les cotisations changent de taux au passage du plafond de la Securite sociale. Il faut donc proceder par approximations successives jusqu'a trouver le brut qui produit le net vise. En ordre de grandeur, pour un non-cadre du secteur prive en 2026, il faut environ 1,26 euro de brut pour obtenir 1 euro de net avant impot. Ainsi, 2 000 euros net correspondent a environ 2 526 euros brut et 2 500 euros net a environ 3 158 euros brut."}},
    {"@type":"Question","name":"Quel est le SMIC net en 2026 ?","acceptedAnswer":{"@type":"Answer","text":"Depuis le 1er juin 2026, le SMIC horaire brut est de 12,31 euros, soit 1 867,02 euros brut par mois pour 35 heures hebdomadaires. Le SMIC net avant impot s'eleve a 1 477,93 euros. Cette revalorisation automatique de 2,41 % a ete declenchee par le franchissement du seuil d'inflation de 2 %."}},
    {"@type":"Question","name":"Quelle difference entre le net a payer et le net imposable ?","acceptedAnswer":{"@type":"Answer","text":"Le net a payer est la somme versee sur votre compte bancaire. Le net imposable est l'assiette de l'impot : il correspond au net avant impot augmente de la CSG non deductible (2,40 %), de la CRDS (0,50 %) et de la part patronale de la mutuelle. Le net imposable est donc toujours superieur au net a payer, souvent de 80 a 150 euros par mois."}},
    {"@type":"Question","name":"Pourquoi un cadre touche-t-il moins net qu'un non-cadre a brut egal ?","acceptedAnswer":{"@type":"Answer","text":"Un cadre paie la cotisation APEC de 0,024 % et, des que son salaire depasse le plafond mensuel de la Securite sociale (4 005 euros en 2026), il cotise en tranche 2 a des taux plus eleves : 8,64 % pour la retraite complementaire contre 3,15 % en tranche 1. Les taux AGIRC-ARRCO de tranche 1 sont identiques pour les cadres et les non-cadres depuis la fusion de 2019."}},
    {"@type":"Question","name":"Quel est le plafond de la Securite sociale en 2026 ?","acceptedAnswer":{"@type":"Answer","text":"Le plafond mensuel de la Securite sociale (PMSS) est fixe a 4 005 euros et le plafond annuel (PASS) a 48 060 euros pour 2026, par l'arrete du 22 decembre 2025 publie au Journal officiel du 23 decembre 2025, soit une hausse de 2 % par rapport a 2025."}},
    {"@type":"Question","name":"Le calcul du salaire net est-il valable en outre-mer ?","acceptedAnswer":{"@type":"Answer","text":"En Guadeloupe, Martinique, La Reunion, Guyane, Saint-Barthelemy et Saint-Martin, les cotisations salariales sont identiques a la metropole. Seule la grille du prelevement a la source differe : l'imposition demarre a 1 875 euros de net imposable mensuel aux Antilles et a La Reunion, et 2 008 euros en Guyane, contre 1 635 euros en metropole. Mayotte releve d'un regime distinct, et la Polynesie francaise, la Nouvelle-Caledonie, Wallis-et-Futuna et Saint-Pierre-et-Miquelon ont des systemes autonomes."}}

<style>
:root{
  /* Palette du hub : papier chaud, encre vert-anthracite, vert profond en signature */
  --paper:#F4F2ED; --paper-2:#EDEAE2; --card:#FFFFFF;
  --ink:#18241F; --ink-soft:#6C7570; --ink-faint:#969E98;
  --rule:#E5E1D8; --rule-strong:#D3CEC2;
  --net:#0D6350; --net-deep:#0A4C3D; --net-bg:#EAF2EE;
  --ret:#35617E; --csg:#A44534; --aut:#7A6E5D; --tax:#93701F;
  --r:15px; --r-sm:11px; --r-xs:8px; --pill:999px;
  --sh-1:0 1px 2px rgba(24,36,31,.04), 0 3px 10px rgba(24,36,31,.045);
  --sh-2:0 2px 5px rgba(24,36,31,.05), 0 12px 30px rgba(24,36,31,.07);
  --ease:cubic-bezier(.22,.61,.36,1);
  --maxw:1180px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;line-height:1.22;margin:0;letter-spacing:-0.015em;}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
a{color:var(--net);text-underline-offset:2px;}
:focus-visible{outline:2px solid var(--net);outline-offset:3px;border-radius:4px;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}

/* ---------- Barre du hub ---------- */
.hubbar{background:var(--ink);color:#E9EDEA;font-size:14px;position:sticky;top:0;z-index:50;}
.hubbar .wrap{display:flex;align-items:center;gap:24px;min-height:56px;flex-wrap:wrap;}
.hublogo{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:17px;color:#fff;text-decoration:none;}
.hublogo span{color:#79C4A6;}
.hubnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center;}
.hubnav a{color:#B6C0BA;text-decoration:none;padding:6px 12px;border-radius:var(--pill);transition:background .18s var(--ease),color .18s var(--ease);}
.hubnav a:hover{color:#fff;background:rgba(255,255,255,.08);}
.hubnav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.11);}
.langtabs{display:flex;background:rgba(255,255,255,.08);border-radius:var(--pill);padding:3px;margin-left:8px;}
.langtabs button{
  background:transparent;border:0;color:#A9B4AE;font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;letter-spacing:.07em;padding:5px 12px;cursor:pointer;border-radius:var(--pill);
  transition:background .18s var(--ease),color .18s var(--ease);
}
.langtabs button:hover{color:#fff;}
.langtabs button[aria-pressed="true"]{background:#79C4A6;color:#062018;font-weight:600;}

/* ---------- Bandeau France, tricolore discret ---------- */
.locale-tag{
  display:inline-flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px;
}
.locale-tag .swatch{display:inline-flex;width:15px;height:15px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(24,36,31,.1);}
.locale-tag .swatch span{flex:1;height:100%;}
.locale-tag .swatch span:nth-child(1){background:#1F3A5F;}
.locale-tag .swatch span:nth-child(2){background:#E8E6DE;}
.locale-tag .swatch span:nth-child(3){background:#A5423A;}

/* ---------- En-tête ---------- */
header.hero{padding:52px 0 34px;}
h1{font-size:clamp(30px,4.8vw,48px);max-width:19ch;letter-spacing:-0.025em;}
.lede{font-size:17.5px;color:var(--ink-soft);max-width:62ch;margin:18px 0 0;line-height:1.6;}
.lede strong{color:var(--ink);font-weight:500;}

/* ---------- Cartes ---------- */
.card,.flowcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-1);border:1px solid rgba(211,206,194,.5);}
.card-pad{padding:26px;}
@media (max-width:520px){.card-pad{padding:20px;}}
.card-head{padding:20px 26px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.card-head h2{font-size:19px;}

/* ---------- Diagramme ---------- */
.flowcard{margin-bottom:30px;overflow:hidden;}
.flowhead{padding:20px 26px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;}
.flowhead h2{font-size:20px;}
.flowhead .hint{font-size:13px;color:var(--ink-faint);}
.flowwrap{padding:14px 26px 26px;}
#sankey{width:100%;height:auto;display:block;}

#sankey .sk-name{font-size:14px;font-weight:500;fill:var(--ink);}
#sankey .sk-amt{font-family:'IBM Plex Mono',monospace;font-size:15.5px;font-weight:600;letter-spacing:-0.01em;}
#sankey .sk-pc{font-family:'IBM Plex Mono',monospace;font-size:12px;fill:var(--ink-faint);}

/* ---------- Grille ---------- */
.grid{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);gap:30px;align-items:start;}
@media (max-width:940px){.grid{grid-template-columns:1fr;gap:24px;}}

/* ---------- Formulaire ---------- */
.sens{display:flex;background:var(--paper-2);border-radius:var(--pill);padding:4px;margin-bottom:24px;}
.sens input{position:absolute;opacity:0;pointer-events:none;}
.sens label{
  flex:1;margin:0;text-align:center;padding:10px 8px;font-size:14px;font-weight:500;cursor:pointer;
  border-radius:var(--pill);color:var(--ink-soft);transition:background .22s var(--ease),color .22s var(--ease),box-shadow .22s var(--ease);
}
.sens input:checked + label{background:var(--card);color:var(--net);box-shadow:var(--sh-1);}
.sens input:focus-visible + label{outline:2px solid var(--net);outline-offset:1px;}
.field{margin-bottom:22px;}
.field:last-child{margin-bottom:0;}
label,.legend{display:block;font-size:14px;font-weight:500;margin-bottom:9px;}
.help{font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
.amount{display:flex;background:var(--card);border:1.5px solid var(--rule-strong);border-radius:var(--r-sm);overflow:hidden;transition:border-color .18s var(--ease),box-shadow .18s var(--ease);}
.amount:focus-within{border-color:var(--net);box-shadow:0 0 0 4px rgba(13,99,80,.1);}
.amount input{flex:1;min-width:0;border:0;padding:14px 16px;font-size:24px;font-weight:500;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:var(--ink);background:transparent;letter-spacing:-0.02em;}
.amount input:focus{outline:none;}
.amount select{border:0;border-left:1px solid var(--rule);background:var(--paper-2);padding:0 14px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;color:var(--ink-soft);cursor:pointer;}
.amount select:focus{outline:none;}
.segmented{display:flex;background:var(--paper-2);border-radius:var(--pill);padding:4px;}
.segmented input{position:absolute;opacity:0;pointer-events:none;}
.segmented label{
  flex:1;margin:0;text-align:center;padding:9px 6px;font-size:13.5px;font-weight:400;cursor:pointer;
  border-radius:var(--pill);color:var(--ink-soft);transition:background .22s var(--ease),color .22s var(--ease),box-shadow .22s var(--ease);
}
.segmented input:checked + label{background:var(--card);color:var(--ink);font-weight:500;box-shadow:var(--sh-1);}
.segmented input:focus-visible + label{outline:2px solid var(--net);outline-offset:1px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:520px){.row2{grid-template-columns:1fr;}}
input[type=number].plain,select.plain{
  width:100%;padding:12px 14px;border:1.5px solid var(--rule-strong);border-radius:var(--r-sm);
  font-family:'IBM Plex Sans',sans-serif;font-size:15px;background:var(--card);color:var(--ink);
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
input[type=number].plain{font-family:'IBM Plex Mono',monospace;}
input[type=number].plain:focus,select.plain:focus{outline:none;border-color:var(--net);box-shadow:0 0 0 4px rgba(13,99,80,.1);}
select.plain:disabled{background:var(--paper-2);color:var(--ink-faint);cursor:not-allowed;}
.check{display:flex;gap:11px;align-items:flex-start;font-size:14px;font-weight:400;}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--net);flex:none;}
details.adv{border-top:1px solid var(--rule);margin-top:24px;padding-top:18px;}
details.adv summary{cursor:pointer;font-size:14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:9px;color:var(--ink-soft);transition:color .18s var(--ease);}
details.adv summary:hover{color:var(--ink);}
details.adv summary::-webkit-details-marker{display:none;}
details.adv summary::before{content:"+";font-family:'IBM Plex Mono',monospace;font-size:15px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;background:var(--paper-2);border-radius:var(--pill);}
details.adv[open] summary::before{content:"–";}
details.adv .inner{padding-top:20px;}
.cmpbtn{
  background:var(--paper-2);border:0;border-radius:var(--pill);padding:9px 16px;
  font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;font-weight:500;color:var(--ink-soft);
  cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s var(--ease);
}
.cmpbtn:hover{background:var(--rule);color:var(--ink);}
.cmpbtn[aria-pressed="true"]{background:var(--ink);color:#fff;}
.cmpbtn .sig{font-family:'IBM Plex Mono',monospace;font-weight:600;}
#panelB{display:none;margin-top:24px;padding:20px;background:var(--paper-2);border-radius:var(--r-sm);}
#panelB.on{display:block;}
.btag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.linkbtn{background:none;border:0;color:var(--net);font-size:12.5px;cursor:pointer;font-family:inherit;padding:0;text-transform:none;letter-spacing:0;text-decoration:underline;text-underline-offset:2px;}

/* ---------- Résultat ---------- */
#terrNotice{margin:14px;padding:20px 22px;background:#FBF4E4;border-radius:var(--r-sm);border-left:3px solid var(--tax);font-size:14px;line-height:1.55;}

#terrNoticeText{color:#7A6230;}
.brutline{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:14px 26px 18px;}
.brutline .lab{font-size:14px;color:var(--ink-soft);}
.brutline .val{font-size:22px;font-weight:600;letter-spacing:-0.02em;}
.ledger{width:100%;border-collapse:collapse;font-size:13.5px;}
.ledger caption{text-align:left;padding:6px 26px 10px;font-size:12.5px;color:var(--ink-faint);}
.ledger th{text-align:right;font-weight:500;font-size:12px;color:var(--ink-faint);padding:0 26px 10px;}
.ledger th:first-child{text-align:left;}
.ledger td{padding:8px 26px;text-align:right;transition:background .15s var(--ease);}
.ledger td:first-child{text-align:left;}
.ledger tbody tr:hover td{background:var(--paper);}
.ledger td.base,.ledger td.rate{color:var(--ink-faint);font-size:12.5px;}
.ledger td.amt{font-weight:500;color:var(--csg);white-space:nowrap;}
.ledger td.amt.credit{color:var(--net);}
.ledger tr.grp td{background:transparent;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;padding-top:16px;padding-bottom:2px;}
.ledger tr.grp:hover td{background:transparent;}
.ledger tr.sub td{border-top:1px solid var(--rule);font-weight:600;padding-top:11px;}
@media (max-width:560px){.ledger td.base,.ledger th.base{display:none;}.ledger td,.ledger th,.ledger caption{padding-left:20px;padding-right:20px;}}
.step{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:14px 26px;}
.step + .step{border-top:1px solid var(--rule);}
.step .lab{font-size:14px;}
.step .lab small{display:block;color:var(--ink-faint);font-size:12px;font-weight:400;margin-top:2px;}
.step .val{font-size:17px;font-weight:500;white-space:nowrap;}
.step.minus .val{color:var(--tax);}
.final{
  padding:26px;margin:14px;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--net) 0%,var(--net-deep) 100%);color:#fff;
}
.final .lab{font-size:13px;font-weight:500;color:rgba(255,255,255,.72);}
.final .big{font-size:clamp(36px,6.5vw,50px);font-weight:600;letter-spacing:-0.03em;line-height:1.05;margin-top:6px;color:#fff;}
.final .sub{font-size:13.5px;color:rgba(255,255,255,.66);margin-top:9px;}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;}
table.cmp th{font-size:12px;color:var(--ink-faint);font-weight:500;padding:6px 26px 12px;text-align:right;}
table.cmp th:first-child{text-align:left;}
table.cmp td{padding:11px 26px;text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
table.cmp tbody tr + tr td{border-top:1px solid var(--rule);}
table.cmp td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;}
table.cmp tr.hero td{background:var(--net-bg);font-weight:600;font-size:16.5px;}
table.cmp tr.hero td:first-child{font-weight:500;font-size:14px;}
td.pos{color:var(--net);font-weight:600;}
td.neg{color:var(--csg);font-weight:600;}

/* ---------- Sections ---------- */
section.block{padding:46px 0;}
section.block + section.block{border-top:1px solid var(--rule);}
section.block h2{font-size:clamp(23px,3.1vw,31px);margin-bottom:10px;}
p.intro{color:var(--ink-soft);max-width:68ch;margin:0 0 26px;font-size:16.5px;}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.fig{background:var(--card);padding:22px;border-radius:var(--r-sm);box-shadow:var(--sh-1);border:1px solid rgba(211,206,194,.5);}
.fig .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
.fig .v{font-size:27px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-0.025em;margin:8px 0 5px;}
.fig .n{font-size:12.5px;color:var(--ink-soft);line-height:1.45;}
.flag{background:var(--card);padding:22px 24px;border-radius:var(--r-sm);margin-bottom:14px;box-shadow:var(--sh-1);border-left:3px solid var(--net);}

<script>
(function(){
"use strict";
var PMSS=4005, SMIC_M=1867.02, HEURES=151.67;
var T={vp:6.90,vd:0.40,mal:1.30,a1:3.15,a2:8.64,g1:0.86,g2:1.08,cet:0.14,apec:0.024,
  csgD:6.80,csgN:2.40,crds:0.50,ab:0.9825,pc:11.10,rafp:5.00,primes:0.20};
var GR={
 metro:[[1635,0],[1698,.5],[1807,1.3],[1928,2.1],[2060,2.9],[2170,3.5],[2315,4.1],[2738,5.3],[3135,7.5],[3571,9.9],[4019,11.9],[4690,13.8],[5624,15.8],[7037,17.9],[8789,20],[12200,24],[16523,28],[25937,33],[55558,38],[Infinity,43]],
 antilles:[[1875,0],[1989,.5],[2191,1.3],[2392,2.1],[2642,2.9],[2786,3.5],[2881,4.1],[3170,5.3],[3920,7.5],[5016,9.9],[5697,11.9],[6599,13.8],[7907,15.8],[8789,17.9],[9989,20],[13738,24],[18253,28],[27858,33],[60893,38],[Infinity,43]],
 guyane:[[2008,0],[2170,.5],[2420,1.3],[2728,2.1],[2833,2.9],[2930,3.5],[3026,4.1],[3362,5.3],[4639,7.5],[6005,9.9],[6772,11.9],[7858,13.8],[8644,15.8],[9577,17.9],[11115,20],[14953,24],[19020,28],[30482,33],[64341,38],[Infinity,43]]};
function tn(ni,c){var g=GR[c]||GR.metro;for(var i=0;i<g.length;i++){if(ni<g[i][0])return g[i][1];}return 43;}
var TERR={metro:{g:'metro',ok:1,al:0},alsace:{g:'metro',ok:1,al:1},gmr:{g:'antilles',ok:1,al:0},
 'gmr-mq':{g:'antilles',ok:1,al:0},'gmr-re':{g:'antilles',ok:1,al:0},guyane:{g:'guyane',ok:1,al:0},
 sbsm:{g:'metro',ok:1,al:0},mayotte:{g:'guyane',ok:0,al:0,n:'ytT',t:'ytX'},
 spm:{g:'metro',ok:0,al:0,n:'spmT',t:'spmX'},com:{g:'metro',ok:0,al:0,n:'comT',t:'comX'}};

/* ============ Moteur de calcul ============ */
function noyau(A, st, terr, mut, mutPat, modePas, tauxPerso, brutHS){
  brutHS = brutHS||0;
  var L=[],tot=0,csgND=0,cat={ret:0,csg:0,aut:0};
  var T1=Math.min(A,PMSS),T2=Math.max(0,Math.min(A,8*PMSS)-PMSS);
  function add(k,b,t,c){var m=b*t/100;if(m<=0)return 0;L.push({k:k,b:b,t:t,m:m});tot+=m;cat[c]+=m;return m;}
  function grp(k){L.push({grp:k});}
  if(st==='fonction'){
    var pr=A*T.primes,tr=A-pr;
    grp('grpRet'); add('cPC',tr,T.pc,'ret'); add('cRAFP',Math.min(pr,tr*0.20),T.rafp,'ret');
    grp('grpCSG'); var bF=A*T.ab;
    add('cCSGD',bF,T.csgD,'csg'); csgND+=add('cCSGN',bF,T.csgN,'csg'); csgND+=add('cCRDS',bF,T.crds,'csg');
    grp('grpDiv'); add('cSol',A,1.00,'aut');
  } else {
    grp('grpSS'); add('cVP',T1,T.vp,'ret'); add('cVD',A,T.vd,'ret');
    if(terr.al) add('cAM',A,T.mal,'aut');
    grp('grpRC'); add('cA1',T1,T.a1,'ret'); if(T2>0) add('cA2',T2,T.a2,'ret');
    add('cG1',T1,T.g1,'ret'); if(T2>0) add('cG2',T2,T.g2,'ret');
    if(A>PMSS) add('cCET',T1+T2,T.cet,'ret');
    if(st==='cadre') add('cAPEC',Math.min(A,4*PMSS),T.apec,'aut');
    grp('grpCSG');
    var b=A<=4*PMSS?A*T.ab:(4*PMSS*T.ab)+(A-4*PMSS);
    add('cCSGD',b,T.csgD,'csg'); csgND+=add('cCSGN',b,T.csgN,'csg'); csgND+=add('cCRDS',b,T.crds,'csg');
  }
  if(mut>0){grp('grpMut');L.push({k:'cMut',b:null,t:null,m:mut});tot+=mut;cat.aut+=mut;}

  /* Heures supplementaires : reduction de cotisations salariales d'assurance vieillesse
     (art. L241-17 CSS), plafonnee a 11,31 % de la remuneration des heures supplementaires. */
  var reducHS=0;
  if(brutHS>0 && st!=='fonction'){
    var txMoy=Math.min(11.31, A>0 ? cat.ret/A*100 : 0);
    reducHS=brutHS*txMoy/100;
    grp('grpHS');
    L.push({k:'cRedHS',b:brutHS,t:txMoy,m:-reducHS});
    tot-=reducHS; cat.ret-=reducHS;
  }

  var netAv=A-tot, netImp=netAv+csgND+mutPat;

  /* Exoneration d'impot sur le revenu des heures supplementaires,
     plafonnee a 7 500 EUR nets par an (art. 81 quater CGI), soit 625 EUR par mois. */
  var exoHS=0;
  if(brutHS>0 && st!=='fonction'){
    exoHS=Math.min(brutHS*(A>0?netImp/A:0), 625);
    netImp-=exoHS;
  }

  var tp = modePas==='zero'?0 : (modePas==='perso'?Math.max(0,Math.min(43,tauxPerso||0)) : tn(netImp,terr.g));
  var pas=netImp*tp/100;
  var pat=0;
  if(st!=='fonction'){
    var mp=A>2.5*SMIC_M?13.00:7.00, af=A>3.5*SMIC_M?5.25:3.45;
    pat+=T1*8.55/100+A*2.11/100+A*mp/100+A*af/100+T1*4.72/100+T2*12.95/100+T1*1.29/100+T2*1.62/100;
    if(A>PMSS)pat+=(T1+T2)*0.21/100;
    pat+=A*(4.05+0.15+2.00+0.30+0.10+1.68)/100;
    if(st==='cadre')pat+=T1*1.50/100+Math.min(A,4*PMSS)*0.036/100;
    pat+=mutPat;
  }
  return {brut:A,lignes:L,total:tot,cat:cat,netAv:netAv,netImp:netImp,pas:pas,tp:tp,mode:modePas,
    netFinal:netAv-pas,cout:A+pat,statut:st,terr:terr,brutHS:brutHS,reducHS:reducHS,exoHS:exoHS};
}
/* Inversion : trouver le brut donnant un net avant impot vise (bissection) */
function inverse(cible, st, terr, mut, mutPat, modePas, tp, partHS){
  partHS=partHS||0;
  var lo=0, hi=Math.max(1000,cible*3);
  for(var i=0;i<70;i++){
    var mid=(lo+hi)/2;
    if(noyau(mid,st,terr,mut,mutPat,modePas,tp,mid*partHS).netAv < cible) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}

/* Decomposition de la duree du travail.
   La duree legale est de 35 h (art. L3121-27), soit 151,67 h par mois. C'est le seuil de
   declenchement des heures supplementaires dans le cas general.
   Certains secteurs relevent d'un regime d'equivalence (art. D3312-45 du code des transports,
   service-public.gouv.fr) : un seuil superieur remplace alors la duree legale. Les heures
   situees entre 35 h et ce seuil sont des heures d'equivalence, payees mais NI majorees,
   NI eligibles a la reduction de 11,31 %, NI a l'exoneration d'impot.
   Au-dela du seuil : +25 % pour les 8 premieres heures, +50 % ensuite. */
function decompose(hSem, seuil){
  var sem=52/12;
  if(seuil==='annuel') return {part:0, equiv:Math.max(0,hSem-35)*sem, supp:0, tot:HEURES+Math.max(0,hSem-35)*sem};
  seuil=parseFloat(seuil)||35;
  var hEq=Math.max(0, Math.min(hSem,seuil)-35)*sem;
  var supp=Math.max(0, hSem-seuil);
  var s25=Math.min(supp,8)*sem, s50=Math.max(0,supp-8)*sem;
  var eq25=s25*1.25, eq50=s50*1.5;
  var tot=HEURES+hEq+eq25+eq50;
  return {part:(eq25+eq50)/tot, equiv:hEq, supp:s25+s50, tot:tot};
}
function partHS(hSem,seuil){return decompose(hSem,seuil).part;}

F.chg=[["Le SMIC a augmenté deux fois en 2026","Une revalorisation légale au 1<sup>er</sup> janvier (1 823,03 € brut), puis une revalorisation automatique de 2,41 % au 1<sup>er</sup> juin, déclenchée par le franchissement du seuil d'inflation de 2 %. Le SMIC brut mensuel est désormais de 1 867,02 €."],
["Le plafond de Sécurité sociale est passé à 4 005 € par mois","Il était de 3 925 € en 2025. Ce plafond sépare la tranche 1 de la tranche 2 : un salarié payé entre 3 925 € et 4 005 € voit ses cotisations changer par rapport à l'an dernier, à salaire identique."],
["La grille du prélèvement à la source a changé au 1<sup>er</sup> mai","La loi de finances pour 2026 ayant été promulguée le 19 février, les nouvelles tranches, revalorisées de 0,90 %, ne s'appliquent que depuis le 1<sup>er</sup> mai 2026."]];
F.omTitle="Outre-mer : trois situations très différentes";
F.omIntro="On parle souvent des « DOM-TOM » comme d'un bloc. Pour le calcul d'un salaire, ils se divisent en trois cas qui n'ont presque rien en commun.";
F.om=[["Guadeloupe, Martinique, La Réunion, Guyane, Saint-Barthélemy, Saint-Martin","Les cotisations salariales sont les mêmes qu'en métropole. Les allègements propres à l'outre-mer (LODEOM) portent sur les cotisations de l'employeur, pas sur ce qui est retenu au salarié.<br><br>La différence se joue sur l'impôt : l'imposition démarre à 1 875 € de net imposable mensuel aux Antilles et à La Réunion, et 2 008 € en Guyane, contre 1 635 € en métropole. À salaire égal, le net après impôt y est supérieur."],
["Mayotte","Le département a son propre régime, géré par la Caisse de Sécurité sociale de Mayotte. Le plafond y est de 3 022 € par mois en 2026 contre 4 005 € ailleurs, et le SMIC de 1 449,93 € brut. Les taux convergent vers le droit commun jusqu'en 2036.<br><br>Appliquer les taux métropolitains donnerait un résultat faux. Le calculateur le signale plutôt que de produire un chiffre trompeur."],
["Polynésie française, Nouvelle-Calédonie, Wallis-et-Futuna, Saint-Pierre-et-Miquelon","Ces collectivités ont des systèmes de protection sociale autonomes : Caisse de prévoyance sociale en Polynésie et à Saint-Pierre-et-Miquelon, CAFAT en Nouvelle-Calédonie. Aucun calculateur fondé sur les barèmes URSSAF ne peut s'y appliquer."]];
F.faqTitle="Questions fréquentes";
F.faq=[["Dans un contrat de 39 h, les heures sup démarrent-elles à 35 h ou à 39 h ?","À 35 h dans l'immense majorité des cas. L'article L3121-27 du Code du travail fixe la durée légale à 35 heures, et c'est un seuil de déclenchement, pas un maximum. Dans un contrat 39 h ordinaire, les 4 heures au-delà de 35 h sont donc bien des heures supplémentaires — on les appelle « structurelles » car prévues dès la signature — et leur majoration d'au moins 25 % est obligatoire.<br><br>Il existe toutefois une exception : les régimes d'équivalence, propres à certains secteurs comportant des périodes d'inaction. Un seuil supérieur y remplace la durée légale. Dans le transport routier de marchandises, il est de 43 h par semaine pour les conducteurs longue distance et de 39 h pour la courte distance et la messagerie. Les heures situées entre 35 h et ce seuil sont des heures d'équivalence : payées, mais ni majorées, ni exonérées. Le calculateur permet de choisir le seuil applicable."],
["Qu'est-ce qu'une heure d'équivalence ?","C'est une heure de travail effectuée entre la durée légale de 35 h et le seuil d'équivalence propre à votre secteur. Le législateur a considéré que certains métiers comportent des temps d'inaction — attente, chargement, surveillance — qui ne constituent pas du travail effectif au sens strict. Ces heures sont rémunérées, mais elles ne sont pas des heures supplémentaires : elles n'ouvrent droit ni à la majoration de 25 %, ni à la réduction de cotisations de 11,31 %, ni à l'exonération d'impôt. Les secteurs concernés sont fixés par décret ou par convention collective étendue : transport routier, tourisme social et familial, commerces de détail de fruits et légumes, gardiennage, entre autres."],
["Quel est le salaire net pour un contrat de 39 heures ?","Un contrat de 39 h comporte 4 heures supplémentaires par semaine, soit 17,33 heures par mois majorées de 25 %. Elles représentent exactement 12,5 % du brut total. Ces heures bénéficient d'un régime dérogatoire : une réduction de cotisations salariales de 11,31 % et une exonération d'impôt sur le revenu dans la limite de 7 500 € nets par an. À brut identique, un salarié à 39 h conserve donc un peu plus de net qu'un salarié à 35 h. Sélectionnez votre durée hebdomadaire dans le calculateur pour voir l'effet exact."],
["Pourquoi la réduction sur les heures supplémentaires est-elle de 11,31 % ?","Parce que ce taux correspond très exactement à la somme des cotisations vieillesse d'un salarié : 6,90 % de vieillesse plafonnée, 0,40 % de vieillesse déplafonnée, 3,15 % de retraite complémentaire AGIRC-ARRCO en tranche 1 et 0,86 % de CEG. Le législateur a plafonné la réduction à ce niveau pour qu'elle annule les cotisations retraite sur ces heures, sans jamais aller au-delà. La CSG et la CRDS, elles, restent intégralement dues."],
["Comment calculer son salaire net à partir du brut ?","On retranche du brut les cotisations salariales : vieillesse plafonnée (6,90 % sous le plafond), vieillesse déplafonnée (0,40 %), AGIRC-ARRCO (3,15 % en tranche 1, 8,64 % en tranche 2), les contributions CEG et CET, et la CSG-CRDS à 9,70 % sur 98,25 % du brut. Contrairement à une idée répandue, la CSG-CRDS pèse souvent plus lourd que la retraite. Le total tourne autour de 21 % du brut."],
["Comment calculer le brut à partir du net ?","Il n'existe pas de formule directe, parce que les taux changent au passage du plafond de la Sécurité sociale. Il faut procéder par approximations successives, ce que fait le mode « net → brut » ci-dessus. En ordre de grandeur, comptez environ 1,26 € de brut pour 1 € de net avant impôt : 2 000 € net correspondent à environ 2 526 € brut, et 2 500 € net à environ 3 158 € brut."],
["Combien fait 2000 € brut en net ?","Environ 1 583 € net avant impôt pour un non-cadre du privé en 2026, soit près de 79 % du brut. Ce montant restant sous le seuil de 1 635 € de net imposable, aucun prélèvement à la source n'est appliqué au taux neutre. Pour 2 500 € brut, comptez environ 1 979 € net ; pour 3 000 € brut, environ 2 375 €."],
["Pourquoi mon net imposable est-il plus élevé que ce que je touche ?","Parce que deux prélèvements ne sont pas déductibles du revenu imposable : la CSG non déductible (2,40 %) et la CRDS (0,50 %). Ils sont bien retenus sur votre salaire, mais le fisc les réintègre dans l'assiette. S'y ajoute la part de mutuelle payée par l'employeur."],
["Un cadre gagne-t-il moins qu'un non-cadre à brut égal ?","Légèrement. Sous le plafond, l'écart se limite à l'APEC (0,024 %), moins d'un euro par mois. Il se creuse au-delà de 4 005 € brut : la part qui dépasse le plafond passe en tranche 2, où la retraite complémentaire monte de 3,15 % à 8,64 %. En contrepartie, le cadre accumule davantage de points de retraite."],
["Le calcul est-il valable en outre-mer ?","Oui pour la Guadeloupe, la Martinique, La Réunion, la Guyane, Saint-Barthélemy et Saint-Martin : seule la grille du prélèvement à la source change. Non pour Mayotte, Saint-Pierre-et-Miquelon, la Polynésie française, la Nouvelle-Calédonie et Wallis-et-Futuna, qui ont des régimes autonomes. Le calculateur affiche alors un avertissement."],
["Le calcul est-il exact au centime près ?","Non, et aucun simulateur généraliste ne peut l'être. Votre convention collective peut prévoir des taux de prévoyance supérieurs aux minima légaux, et certains éléments (primes, heures supplémentaires exonérées, avantages en nature) modifient l'assiette. Pour un calcul officiel, le simulateur de l'URSSAF fait référence."]];

N.chg=[["The SMIC rose twice in 2026","A statutory increase on 1 January (€1,823.03 gross), then an automatic 2.41 % rise on 1 June, triggered when inflation passed the 2 % threshold. The monthly gross minimum wage is now €1,867.02."],
["The social security ceiling rose to €4,005 per month","It was €3,925 in 2025. This ceiling separates band 1 from band 2, so an employee paid between €3,925 and €4,005 sees their contributions change from last year at the same salary."],
["The withholding tax grid changed on 1 May","Because the 2026 budget act was only promulgated on 19 February, the new bands, uprated by 0.90 %, have only applied since 1 May 2026."]];

N.om=[["Guadeloupe, Martinique, Réunion, French Guiana, Saint Barthélemy, Saint Martin","Employee contributions are the same as in mainland France. The overseas reliefs (LODEOM) apply to employer contributions, not to what is deducted from the employee.<br><br>The difference is in income tax: tax starts at €1,875 of monthly taxable net in the Antilles and Réunion, and €2,008 in French Guiana, against €1,635 in mainland France. At equal salary, net pay after tax is therefore higher."],
["Mayotte","The department has its own scheme, run by the Caisse de Sécurité Sociale de Mayotte. The ceiling is €3,022 per month in 2026 against €4,005 elsewhere, and the minimum wage €1,449.93 gross. Rates are converging with mainland law until 2036.<br><br>Applying mainland rates would give a wrong result. The calculator says so rather than producing a misleading figure."],
["French Polynesia, New Caledonia, Wallis and Futuna, Saint Pierre and Miquelon","These collectivities run autonomous social protection systems: the Caisse de Prévoyance Sociale in Polynesia and Saint Pierre and Miquelon, CAFAT in New Caledonia. No calculator based on URSSAF rates can apply there."]];
N.faqTitle="Frequently asked questions";
N.faq=[["On a 39-hour contract, does overtime start at 35 or at 39 hours?","At 35 in the vast majority of cases. Article L3121-27 of the French Labour Code sets the statutory duration at 35 hours, and that is a trigger threshold, not a ceiling. On an ordinary 39-hour contract, the 4 hours beyond 35 are therefore genuine overtime — called structural overtime because they are built into the contract — and the premium of at least 25 % is mandatory.<br><br>There is one exception: equivalence regimes, specific to sectors involving periods of inactivity. A higher threshold replaces the statutory duration there. In road freight transport it is 43 hours a week for long-haul drivers and 39 hours for short-haul and parcel delivery. Hours between 35 and that threshold are equivalence hours: paid, but neither enhanced nor exempt. The calculator lets you select the applicable threshold."],
["What is an equivalence hour?","It is an hour worked between the statutory 35 hours and the equivalence threshold specific to your sector. Lawmakers considered that certain jobs involve periods of inactivity — waiting, loading, surveillance — that do not amount to effective working time in the strict sense. These hours are paid, but they are not overtime: they carry no 25 % premium, no 11.31 % contribution reduction and no income tax exemption. The sectors concerned are set by decree or by extended collective agreement: road transport, social and family tourism, fruit and vegetable retail, and security work, among others."],
["What is the net salary on a 39-hour contract?","A 39-hour contract carries 4 overtime hours a week, or 17.33 hours a month at a 25 % premium. They make up exactly 12.5 % of total gross. These hours enjoy a special regime: an 11.31 % reduction in employee contributions and an income tax exemption up to €7,500 net a year. At identical gross, a 39-hour employee therefore keeps slightly more net than a 35-hour one. Select your weekly hours in the calculator to see the exact effect."],
["Why is the overtime reduction set at 11.31 %?","Because that rate matches the sum of an employee's pension contributions exactly: 6.90 % capped state pension, 0.40 % uncapped state pension, 3.15 % AGIRC-ARRCO band 1 and 0.86 % CEG. Lawmakers capped the reduction at that level so it cancels the pension contributions on those hours without ever going further. CSG and CRDS remain fully due."],
["How do you calculate net salary from gross in France?","You deduct employee social contributions from the gross: capped state pension (6.90 % below the ceiling), uncapped state pension (0.40 %), AGIRC-ARRCO (3.15 % in band 1, 8.64 % in band 2), the CEG and CET contributions, and CSG-CRDS at 9.70 % on 98.25 % of gross. Contrary to a common belief, CSG-CRDS often weighs more than pension contributions. The total comes to around 21 % of gross."],
["How do you work out gross from net?","There is no direct formula, because rates change at the social security ceiling. You have to proceed by successive approximation, which is what the net → gross mode above does. As a rule of thumb, allow about €1.26 of gross for €1 of net before tax: €2,000 net corresponds to roughly €2,526 gross, and €2,500 net to about €3,158 gross."],
["What is €2,000 gross in net?","About €1,583 net before tax for a private sector non-cadre in 2026, close to 79 % of gross. As that stays below the €1,635 taxable net threshold, no withholding tax applies at the default rate. For €2,500 gross, expect about €1,979 net; for €3,000 gross, about €2,375."],
["Why is my taxable net higher than what I receive?","Because two levies are not deductible from taxable income: non-deductible CSG (2.40 %) and CRDS (0.50 %). They are genuinely withheld from your salary, but the tax authority adds them back into the base. The employer share of health cover is added too."],
["Does a cadre earn less than a non-cadre on the same gross?","Slightly. Below the ceiling the gap is just the APEC levy (0.024 %), under a euro a month. It widens above €4,005 gross: the portion above the ceiling moves into band 2, where the supplementary pension rate rises from 3.15 % to 8.64 %. In exchange, cadres accumulate more pension points."],
["Does this work for overseas France?","Yes for Guadeloupe, Martinique, Réunion, French Guiana, Saint Barthélemy and Saint Martin: only the withholding tax grid differs. No for Mayotte, Saint Pierre and Miquelon, French Polynesia, New Caledonia and Wallis and Futuna, which run autonomous schemes. The calculator then shows a notice."],
["Is the calculation exact to the cent?","No, and no general calculator can be. Your collective agreement may set higher benefit rates than the legal minimum, and items such as bonuses, tax-exempt overtime and benefits in kind change the base. For an official calculation, the URSSAF simulator is the reference."]];

var lang='fr',L=D.fr,cmpOn=false,fmt0,fmt2;
var $=function(i){return document.getElementById(i);};
var E={};['brut','brutB','periode','quotite','quotiteB','heures','seuil','seuilWrap','mois','pasMode','pasPerso','pasPersoWrap','mutuelle','mutuellePat','territoire','coutEmp'].forEach(function(i){E[i]=$(i);});
function rad(n){var r=document.querySelector('input[name='+n+']:checked');return r?r.value:null;}
function setFormats(){var lo=lang==='fr'?'fr-FR':'en-GB';
  fmt0=new Intl.NumberFormat(lo,{style:'currency',currency:'EUR',maximumFractionDigits:0});
  fmt2=new Intl.NumberFormat(lo,{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});}
function eur(v){return fmt0.format(v);}
function eur2(v){return fmt2.format(v);}
function pct(v){return v.toLocaleString(lang==='fr'?'fr-FR':'en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})+' %';}

/* ============ Scénarios ============ */
function lit(scen){
  var terr=TERR[E.territoire.value]||TERR.metro;
  var mut=parseFloat(E.mutuelle.value)||0, mutPat=parseFloat(E.mutuellePat.value)||0;
  var mode=E.pasMode.value, tp=parseFloat(E.pasPerso.value)||0;
  var st = scen==='B'? rad('statutB') : rad('statut');
  var hSem = parseFloat(E.heures.value)||35;
  var seuil = E.seuil.value;
  var dec = decompose(hSem, seuil);
  var pHS = dec.part;
  var q  = hSem>35 ? 1 : (scen==='B'? parseFloat(E.quotiteB.value): parseFloat(E.quotite.value))/100;
  var nb = parseFloat(E.mois.value), per=E.periode.value;
  var saisi = parseFloat(scen==='B'?E.brutB.value:E.brut.value); if(isNaN(saisi)||saisi<0)saisi=0;
  var sens = rad('sens');
  var hMois = hSem*(52/12);

  var A;
  if(sens==='nb'){
    var cibleM = per==='an'? saisi/12 : (per==='heure'? saisi*hMois : saisi);
    A = inverse(cibleM*q, st, terr, mut, mutPat, mode, tp, pHS);
  } else {
    var bm = per==='an'? saisi/12*q : (per==='heure'? saisi*hMois*q : saisi*q);
    A = (per==='an'? bm*12 : bm*nb)/12;
  }
  return noyau(A, st, terr, mut, mutPat, mode, tp, A*pHS);
}

/* ============ Sankey ============ */
var SVGNS='http://www.w3.org/2000/svg';
var cur=null, raf=null;
function cible(r){
  var t=r.brut||1;
  return {ret:r.cat.ret/t, csg:r.cat.csg/t, aut:r.cat.aut/t, imp:r.pas/t, net:r.netFinal/t, brut:r.brut};
}
function lerp(a,b,f){return a+(b-a)*f;}
function dessine(v, r){
  var svg=$('sankey'); if(!svg) return;
  var box = svg.parentNode ? svg.parentNode.clientWidth : 0;
  var etroit = (box || 700) < 620;
  var segs=[
    {k:'nRet',c:'var(--ret)',v:v.ret,m:r.cat.ret},
    {k:'nCsg',c:'var(--csg)',v:v.csg,m:r.cat.csg},
    {k:'nAut',c:'var(--aut)',v:v.aut,m:r.cat.aut},
    {k:'nImp',c:'var(--tax)',v:v.imp,m:r.pas},
    {k:'nNet',c:'var(--net)',v:v.net,m:r.netFinal}
  ].filter(function(s){return s.v>0.0015;});
  var svgh = etroit ? barres(segs,r) : flux(segs,r);
  var vb = svgh.match(/data-vb="([^"]+)"/);
  svg.setAttribute('viewBox','0 0 '+(vb?vb[1]:'900 430'));
  svg.innerHTML='<desc id="sankeyDesc">'+esc(L.sankDesc)+'</desc>'+svgh;
}
function pcTxt(x){return (x*100).toFixed(1).replace('.',lang==='fr'?',':'.')+' %';}

/* Rendu large : rubans de Sankey a courbes de Bezier */
function flux(segs,r){
  var W=900,H=430,nodeW=13,labW=258,gap=11,minGap=52;
  var top=64,bot=H-24,hh=bot-top;
  var x0=8,x1=W-labW-nodeW;
  var tot=segs.reduce(function(a,s){return a+s.v;},0)||1;
  var dispo=hh-(segs.length-1)*gap;

  var hr=segs.map(function(s){return dispo*(s.v/tot);});
  var yr=[],y=top,i;
  for(i=0;i<segs.length;i++){yr.push(y);y+=hr[i]+gap;}

  /* Les libelles suivent le centre de leur noeud, puis on les ecarte pour eviter tout chevauchement */
  var c=segs.map(function(s,i){return yr[i]+hr[i]/2;});
  for(i=1;i<c.length;i++) if(c[i]-c[i-1]<minGap) c[i]=c[i-1]+minGap;
  for(i=c.length-2;i>=0;i--) if(c[i+1]-c[i]<minGap) c[i]=c[i+1]-minGap;

  var s='<defs>';
  segs.forEach(function(sg,i){
    s+='<linearGradient id="skg'+i+'" x1="0" y1="0" x2="1" y2="0">'
      +'<stop offset="0" stop-color="'+sg.c+'" stop-opacity=".22"/>'
      +'<stop offset="1" stop-color="'+sg.c+'" stop-opacity=".8"/></linearGradient>';
  });
  s+='</defs>';

  s+='<text class="sk-cap" x="'+x0+'" y="'+(top-34)+'">'+esc(L.nBrut)+'</text>';
  s+='<text class="sk-tot" x="'+x0+'" y="'+(top-8)+'">'+esc(eur(r.brut))+'</text>';
  s+='<rect x="'+x0+'" y="'+top+'" width="'+nodeW+'" height="'+hh+'" fill="var(--ink)" rx="2.5"/>';

  var yl=top;
  segs.forEach(function(sg,i){
    var hl=hh*(sg.v/tot),xa=x0+nodeW,xb=x1,mid=(xa+xb)/2;
    s+='<path class="ribbon" fill="url(#skg'+i+')" d="M'+xa+','+f(yl)+' C'+mid+','+f(yl)+' '+mid+','+f(yr[i])+' '+xb+','+f(yr[i])
      +' L'+xb+','+f(yr[i]+hr[i])+' C'+mid+','+f(yr[i]+hr[i])+' '+mid+','+f(yl+hl)+' '+xa+','+f(yl+hl)+' Z">'
      +'<title>'+esc(L[sg.k]+' · '+eur2(sg.m)+' · '+pcTxt(sg.v))+'</title></path>';
    s+='<rect x="'+xb+'" y="'+f(yr[i])+'" width="'+nodeW+'" height="'+f(Math.max(2,hr[i]))+'" fill="'+sg.c+'" rx="2.5"/>';

    var tx=xb+nodeW+16, cy=c[i], ny=yr[i]+hr[i]/2;
    if(Math.abs(cy-ny)>2.5){
      s+='<path class="sk-lead" d="M'+(xb+nodeW+3)+','+f(ny)+' L'+(tx-8)+','+f(cy)+'" stroke="'+sg.c+'"/>';
    }
    s+='<text class="sk-name" x="'+tx+'" y="'+f(cy-6)+'">'+esc(L[sg.k])+'</text>';
    s+='<text class="sk-amt" x="'+tx+'" y="'+f(cy+15)+'" fill="'+sg.c+'">'+esc(eur2(sg.m))+'</text>';
    s+='<text class="sk-pc" x="'+(W-10)+'" y="'+f(cy+15)+'" text-anchor="end">'+esc(pcTxt(sg.v))+'</text>';
    yl+=hl;
  });
  return '<svg-inner/>'.replace('<svg-inner/>','')+wrapSvg(W,H,s);
}

/* Rendu etroit : barres proportionnelles empilees, bien plus lisibles qu'un Sankey comprime */
function barres(segs,r){
  var W=380,rowH=56,H=segs.length*rowH+58,x=0,barW=W;
  var tot=segs.reduce(function(a,s){return a+s.v;},0)||1;
  var s='';
  s+='<text class="sk-cap" x="0" y="16">'+esc(L.nBrut)+'</text>';
  s+='<text class="sk-tot" x="0" y="42">'+esc(eur(r.brut))+'</text>';
  segs.forEach(function(sg,i){
    var y=58+i*rowH;
    s+='<text class="sk-name" x="0" y="'+(y+11)+'">'+esc(L[sg.k])+'</text>';
    s+='<text class="sk-amt" x="'+W+'" y="'+(y+11)+'" text-anchor="end" fill="'+sg.c+'">'+esc(eur2(sg.m))+'</text>';
    s+='<rect x="0" y="'+(y+20)+'" width="'+barW+'" height="13" rx="2.5" fill="var(--rule)" opacity=".55"/>';
    s+='<rect x="0" y="'+(y+20)+'" width="'+f(Math.max(3,barW*(sg.v/tot)))+'" height="13" rx="2.5" fill="'+sg.c+'"><title>'
      +esc(L[sg.k]+' · '+pcTxt(sg.v))+'</title></rect>';
    s+='<text class="sk-pc" x="'+W+'" y="'+(y+43)+'" text-anchor="end">'+esc(pcTxt(sg.v))+'</text>';
  });
  return wrapSvg(W,H,s);
}
function wrapSvg(W,H,s){return '<g data-vb="'+W+' '+H+'">'+s+'</g>';}
function f(n){return Math.round(n*100)/100;}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function anime(r){
  var but=cible(r);
  if(!cur){cur=but;dessine(cur,r);return;}
  var dep={ret:cur.ret,csg:cur.csg,aut:cur.aut,imp:cur.imp,net:cur.net};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){cur=but;dessine(cur,r);return;}
  var t0=performance.now(),dur=320;
  if(raf)cancelAnimationFrame(raf);
  (function boucle(t){
    var f=Math.min(1,(t-t0)/dur); var e=1-Math.pow(1-f,3);
    cur={ret:lerp(dep.ret,but.ret,e),csg:lerp(dep.csg,but.csg,e),aut:lerp(dep.aut,but.aut,e),
         imp:lerp(dep.imp,but.imp,e),net:lerp(dep.net,but.net,e),brut:but.brut};
    dessine(cur,r);
    if(f<1) raf=requestAnimationFrame(boucle);
  })(t0);
}

/* ============ Rendu ============ */
function affiche(){
  var r=lit('A'), t=r.terr, bloque=!t.ok;
  $('terrNotice').style.display=bloque?'block':'none';
  if(bloque){$('terrNoticeTitle').textContent=L[t.n];$('terrNoticeText').textContent=L[t.t];}
  $('viewSimple').style.display=(bloque||cmpOn)?'none':'';
  $('viewCmp').style.display=(!bloque&&cmpOn)?'':'none';
  document.querySelector('.flowcard').style.display=bloque?'none':'';
  if(bloque){$('terrHelp').textContent=L.grNon;return;}

  $('terrHelp').textContent=(t.g==='metro')?L.grMetro:(t.g==='antilles'?L.grAnt:L.grGuy);
  $('flowHint').textContent=L.flowHint;
  anime(r);

  if(cmpOn){ rendCmp(r, lit('B')); }
  else {
    $('outBrut').textContent=eur(r.brut);
    var h='';
    r.lignes.forEach(function(li){
      if(li.grp){h+='<tr class="grp"><td colspan="4">'+L[li.grp]+'</td></tr>';return;}
      var neg=li.m<0;
      h+='<tr><td>'+L[li.k]+'</td><td class="base num">'+(li.b!=null?eur(li.b):'—')+'</td><td class="rate num">'
        +(li.t!=null?pct(li.t):'—')+'</td><td class="amt num'+(neg?' credit':'')+'">'
        +(neg?'+ ':'− ')+eur2(Math.abs(li.m))+'</td></tr>';
    });
    h+='<tr class="sub"><td>'+L.thTotal+'</td><td class="base"></td><td class="rate num">'
      +(r.brut>0?pct(r.total/r.brut*100):'—')+'</td><td class="amt num">− '+eur2(r.total)+'</td></tr>';
    $('ledgerBody').innerHTML=h;
    $('outNetAvant').textContent=eur2(r.netAv);
    $('tauxGlobal').textContent=r.brut>0?L.gConserve((r.netAv/r.brut*100).toLocaleString(lang==='fr'?'fr-FR':'en-GB',{maximumFractionDigits:1})):'';
    $('outNetImp').textContent=eur2(r.netImp);
    var gN=(t.g==='metro')?L.gN1:(t.g==='antilles'?L.gN2:L.gN3);
    $('pasDetail').textContent = r.mode==='zero'?L.pasZeroTxt
      :(r.mode==='perso'?L.pasPersoTxt(r.tp.toLocaleString(lang==='fr'?'fr-FR':'en-GB'))
      :L.pasNeutreTxt(r.tp.toLocaleString(lang==='fr'?'fr-FR':'en-GB'),gN));
    $('outPas').textContent=r.pas>0?'− '+eur2(r.pas):eur2(0);
    $('outNet').textContent=eur2(r.netFinal);
    $('outNetSub').textContent=L.subMois(eur(r.netFinal*12));
    if(E.coutEmp.checked&&r.statut!=='fonction'){$('coutBox').style.display='flex';$('outCout').textContent=eur(r.cout);}
    else $('coutBox').style.display='none';
  }
  $('statutHelp').innerHTML=r.statut==='fonction'?L.hFP:(r.statut==='cadre'?L.hC:L.hNC);
  var hS=parseFloat(E.heures.value)||35, sl=E.seuil.value, dc=decompose(hS,sl);
  E.quotite.disabled = hS>35; E.quotiteB.disabled = hS>35;
  E.seuilWrap.style.display = hS>35 ? '' : 'none';
  var dec2=function(x){return x.toFixed(1).replace('.',lang==='fr'?',':'.');};
  if(hS<=35){
    $('heuresHelp').textContent = L.hHS35;
  } else if(dc.part>0){
    var exoPlein = r.exoHS>=624.99;
    $('heuresHelp').innerHTML = L.hHS(hS, dec2(dc.part*100))
      + (r.statut==='fonction' ? ' '+L.hHSfp : (exoPlein?' '+L.hHSplaf:''));
  } else {
    $('heuresHelp').innerHTML = L.hHSaucune(hS);
  }
  if(hS>35){
    $('seuilHelp').innerHTML = (sl==='annuel') ? L.sqAn
      : (sl==='35' ? L.sq35 : L.sqEq(sl, dec2(dc.equiv), dec2(dc.supp)));
  }
}
function rendCmp(a,b){
  var rows=[[L.rowBrut,a.brut,b.brut,1],[L.thTotal,a.total,b.total,-1],
    [L.rowNetAv,a.netAv,b.netAv,1],[L.rowPas,a.pas,b.pas,-1]];
  var h='';
  rows.forEach(function(x){
    var d=x[2]-x[1], cls=(d===0)?'':((d>0)===(x[3]>0)?'pos':'neg');
    h+='<tr><td>'+x[0]+'</td><td>'+eur2(x[1])+'</td><td>'+eur2(x[2])+'</td><td class="'+cls+'">'
      +(d>0?'+':'')+eur2(d)+'</td></tr>';
  });
  var dn=b.netFinal-a.netFinal;
  h+='<tr class="hero"><td>'+L.rowFinal+'</td><td>'+eur2(a.netFinal)+'</td><td>'+eur2(b.netFinal)
    +'</td><td class="'+(dn===0?'':(dn>0?'pos':'neg'))+'">'+(dn>0?'+':'')+eur2(dn)+'</td></tr>';
  h+='<tr><td>'+L.cmpAn+'</td><td>'+eur(a.netFinal*12)+'</td><td>'+eur(b.netFinal*12)
    +'</td><td class="'+(dn===0?'':(dn>0?'pos':'neg'))+'">'+(dn>0?'+':'')+eur(dn*12)+'</td></tr>';
  $('cmpBody').innerHTML=h;
}
function rendConv(){
  var terr=TERR.metro,h='';
  [1500,1800,2000,2200,2500,3000,3500,4000,5000].forEach(function(v){
    var nc=noyau(v,'noncadre',terr,0,0,'neutre',0), c=noyau(v,'cadre',terr,0,0,'neutre',0);
    h+='<tr><td>'+eur(v)+'</td><td class="hl">'+eur2(nc.netAv)+'</td><td>'+eur2(c.netAv)+'</td><td>'+eur(nc.netAv*12)+'</td></tr>';
  });
  $('convBody').innerHTML=h;
}
function rendSections(){
  $('chgBox').innerHTML=L.chg.map(function(x){return '<div class="flag"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>';}).join('');
  $('omBox').innerHTML=L.om.map(function(x){return '<div class="flag"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>';}).join('');
  $('faqBox').innerHTML=L.faq.map(function(x){return '<details><summary>'+x[0]+'</summary><div class="ans">'+x[1]+'</div></details>';}).join('');
  $('srcBox').innerHTML=L.src.map(function(x){return '<li>'+x+'</li>';}).join('');
}
function majSens(){
  var nb = rad('sens')==='nb';
  $('lblMontant').textContent = nb?L.lblMontantN:L.lblMontantB;
  $('lblMontantB').textContent = nb?L.lblMontantN:L.lblMontantB;
  $('helpMontant').textContent = nb?L.helpMontantN:L.helpMontantB;
}
function setLang(l){
  lang=(l==='en')?'en':'fr';L=D[lang];setFormats();
  document.documentElement.lang=lang;document.title=L.title;
  var md=document.querySelector('meta[name=description]');if(md)md.setAttribute('content',L.metaDesc);
  $('btnFr').setAttribute('aria-pressed',lang==='fr');$('btnEn').setAttribute('aria-pressed',lang==='en');
  var a=document.querySelectorAll('[data-i]');
  for(var i=0;i<a.length;i++){var k=a[i].getAttribute('data-i');if(L[k]!=null)a[i].textContent=L[k];}
  var b=document.querySelectorAll('[data-ihtml]');
  for(var j=0;j<b.length;j++){var k2=b[j].getAttribute('data-ihtml');if(L[k2]!=null)b[j].innerHTML=L[k2];}
  ['ogMetro','ogDom','ogCom'].forEach(function(id){var o=$(id);if(o&&L[id])o.label=L[id];});
  $('cmpBtn').querySelector('[data-i=cmpBtn]').textContent = cmpOn?L.cmpBtnOn:L.cmpBtn;
  majSens();rendSections();rendConv();cur=null;affiche();
  /* Pas de reecriture d'adresse quand les deux langues ont leur propre page :
     cela creerait un doublon aux yeux des moteurs de recherche. */
  if(!window.__ALT__){ try{history.replaceState(null,'',lang==='en'?'?lang=en':location.pathname);}catch(e){} }
}

/* ============ Écouteurs ============ */
/* Si la page a une jumelle dans l'autre langue (adresses generees a la
   publication), on y navigue. Sinon on bascule sur place. */
function versLangue(l){
  var alt=window.__ALT__;
  if(alt && alt[l] && l!==lang){ location.href=alt[l]; return; }
  setLang(l);
}
$('btnFr').addEventListener('click',function(){versLangue('fr');});
$('btnEn').addEventListener('click',function(){versLangue('en');});
$('cmpBtn').addEventListener('click',function(){
  cmpOn=!cmpOn;
  this.setAttribute('aria-pressed',cmpOn);
  this.querySelector('.sig').textContent=cmpOn?'×':'+';
  this.querySelector('[data-i=cmpBtn]').textContent=cmpOn?L.cmpBtnOn:L.cmpBtn;
  $('panelB').classList.toggle('on',cmpOn);
  affiche();
});
$('copyA').addEventListener('click',function(){
  E.brutB.value=E.brut.value; E.quotiteB.value=E.quotite.value;
  var s=rad('statut'); var m={noncadre:'sb-nc',cadre:'sb-c',fonction:'sb-fp'};
  if($(m[s])) $(m[s]).checked=true;
  affiche();
});
E.pasMode.addEventListener('change',function(){E.pasPersoWrap.style.display=(E.pasMode.value==='perso')?'block':'none';affiche();});
document.addEventListener('input',function(e){if(e.target.closest('#form'))affiche();});
document.addEventListener('change',function(e){
  if(e.target.name==='sens'){majSens();}
  if(e.target.closest('#form'))affiche();
});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(cur)dessine(cur,lit('A'));},150);});

var p=new URLSearchParams(location.search).get('lang')
      || window.__LANG__ || document.documentElement.lang;
setLang(p==='en'?'en':'fr');
})();
</script>
