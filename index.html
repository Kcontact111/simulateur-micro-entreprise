<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebSite",
  "name":"Les Bons Chiffres",
  "url":"https://example.com/",
  "inLanguage":"fr-FR",
  "description":"Calculateurs fiscaux et sociaux francais tenus a jour des baremes officiels."
}
</script>

<style>
:root{
  --paper:#F4F2ED; --paper-2:#EDEAE2; --card:#FFFFFF;
  --ink:#18241F; --ink-soft:#6C7570; --ink-faint:#969E98;
  --rule:#E5E1D8; --rule-strong:#D3CEC2;
  --net:#0D6350; --net-deep:#0A4C3D; --net-bg:#EAF2EE;
  --tax:#93701F;
  --r:15px; --r-sm:11px; --pill:999px;
  --sh-1:0 1px 2px rgba(24,36,31,.04), 0 3px 10px rgba(24,36,31,.045);
  --sh-2:0 2px 5px rgba(24,36,31,.05), 0 12px 30px rgba(24,36,31,.07);
  --ease:cubic-bezier(.22,.61,.36,1);
  --maxw:1180px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.62;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;line-height:1.22;margin:0;letter-spacing:-0.015em;}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
a{color:var(--net);text-underline-offset:2px;}
:focus-visible{outline:2px solid var(--net);outline-offset:3px;border-radius:4px;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}

.hubbar{background:var(--ink);color:#E9EDEA;font-size:14px;position:sticky;top:0;z-index:50;}
.hubbar .wrap{display:flex;align-items:center;gap:24px;min-height:56px;flex-wrap:wrap;}
.hublogo{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:17px;color:#fff;text-decoration:none;}
.hublogo span{color:#79C4A6;}
.hubnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center;}
.hubnav a{color:#B6C0BA;text-decoration:none;padding:6px 12px;border-radius:var(--pill);transition:background .18s var(--ease),color .18s var(--ease);}
.hubnav a:hover{color:#fff;background:rgba(255,255,255,.08);}
.langtabs{display:flex;background:rgba(255,255,255,.08);border-radius:var(--pill);padding:3px;margin-left:8px;}
.langtabs button{background:transparent;border:0;color:#A9B4AE;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.07em;padding:5px 12px;cursor:pointer;border-radius:var(--pill);transition:background .18s var(--ease),color .18s var(--ease);}
.langtabs button:hover{color:#fff;}
.langtabs button[aria-pressed="true"]{background:#79C4A6;color:#062018;font-weight:600;}

.locale-tag{display:inline-flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px;}
.locale-tag .swatch{display:inline-flex;width:15px;height:15px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(24,36,31,.1);}
.locale-tag .swatch span{flex:1;height:100%;}
.locale-tag .swatch span:nth-child(1){background:#1F3A5F;}
.locale-tag .swatch span:nth-child(2){background:#E8E6DE;}
.locale-tag .swatch span:nth-child(3){background:#A5423A;}

header.hero{padding:64px 0 44px;}
h1{font-size:clamp(32px,5.4vw,54px);max-width:17ch;letter-spacing:-0.03em;}
.lede{font-size:18.5px;color:var(--ink-soft);max-width:60ch;margin:20px 0 0;line-height:1.58;}
.lede strong{color:var(--ink);font-weight:500;}

section.block{padding:46px 0;}
section.block + section.block{border-top:1px solid var(--rule);}
section.block h2{font-size:clamp(23px,3.1vw,31px);margin-bottom:10px;}
p.intro{color:var(--ink-soft);max-width:66ch;margin:0 0 28px;font-size:16.5px;}

.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;}
.tool{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);padding:26px;text-decoration:none;color:var(--ink);box-shadow:var(--sh-1);border:1px solid rgba(211,206,194,.5);transition:transform .22s var(--ease),box-shadow .22s var(--ease);}
a.tool:hover{transform:translateY(-3px);box-shadow:var(--sh-2);}
.tool .tk{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:9px;}
.tool .tt{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:20px;margin:10px 0 8px;letter-spacing:-0.015em;}
.tool .td{font-size:14.5px;color:var(--ink-soft);line-height:1.55;flex:1;}
.tool .go{margin-top:16px;font-size:13.5px;font-weight:500;color:var(--net);}
.tool.soon{opacity:.62;}
.tool.soon .tk{color:var(--tax);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--net);display:inline-block;}
.tool.soon .dot{background:var(--tax);}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.fig{background:var(--card);padding:22px;border-radius:var(--r-sm);box-shadow:var(--sh-1);border:1px solid rgba(211,206,194,.5);}
.fig .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
.fig .v{font-size:27px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:-0.025em;margin:8px 0 5px;}
.fig .n{font-size:12.5px;color:var(--ink-soft);line-height:1.45;}

.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px;}
.prop h3{font-size:17.5px;margin-bottom:8px;}
.prop p{margin:0;font-size:14.8px;color:var(--ink-soft);line-height:1.6;}
.prop .mark{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--net);letter-spacing:.06em;margin-bottom:12px;display:block;}

footer.site{background:var(--ink);color:#A9B4AE;padding:40px 0;font-size:13.5px;margin-top:44px;}
footer.site a{color:#8FCFB4;}
footer.site p{margin:0 0 10px;max-width:82ch;}
footer.site .fl{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>

<nav class="hubbar"><div class="wrap">
  <a class="hublogo" href="/">Les Bons <span>Chiffres</span></a>
  <div class="hubnav">
    <a href="#outils" data-i="navOutils"></a>
    <a href="#chiffres" data-i="navChiffres"></a>
    <div class="langtabs" role="group" aria-label="Language">
      <button type="button" id="btnFr" aria-pressed="true">FR</button>
      <button type="button" id="btnEn" aria-pressed="false">EN</button>
    </div>
  </div>
</div></nav>

<header class="hero"><div class="wrap">
  <div class="locale-tag"><span class="swatch"><span></span><span></span><span></span></span><span data-i="eyebrow"></span></div>
  <h1 data-i="h1"></h1>
  <p class="lede" data-ihtml="lede"></p>
</div></header>

<section class="block" id="outils"><div class="wrap">
  <h2 data-i="outilsTitre"></h2>
  <p class="intro" data-i="outilsIntro"></p>
  <div class="tools" id="toolsGrid"></div>
</div></section>

<section class="block" id="chiffres"><div class="wrap">
  <h2 data-i="chiffresTitre"></h2>
  <p class="intro" data-i="chiffresIntro"></p>
  <div class="figs" id="figsGrid"></div>
</div></section>

<section class="block"><div class="wrap">
  <h2 data-i="pourquoiTitre"></h2>
  <p class="intro" data-i="pourquoiIntro"></p>
  <div class="props" id="propsGrid"></div>
</div></section>

<footer class="site"><div class="wrap">
  <div class="fl" id="footLinks"></div>
  <p><strong style="color:#fff;font-family:'IBM Plex Serif',serif;">Les Bons Chiffres</strong> <span data-i="footer1"></span></p>
  <p data-ihtml="footer2"></p>
</div></footer>

<script src="/baremes.js"></script>
<script>
(function(){
"use strict";
var B = window.BAREMES;
if(!B){ document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Le fichier baremes.js n\u2019a pas pu être chargé. Vérifiez qu\u2019il se trouve bien à la racine du site.</p>'; return; }

var D={fr:{},en:{}},F=D.fr,N=D.en;

F.title="Les Bons Chiffres — calculateurs fiscaux et sociaux français, à jour des barèmes 2026";
F.navOutils="Les outils";F.navChiffres="Chiffres 2026";
F.eyebrow="France · Barèmes vérifiés le {dateMaj}";
F.h1="Les calculs administratifs français, faits correctement";
F.lede="Salaire, cotisations, seuils fiscaux : des calculateurs <strong>tenus à jour des barèmes réellement en vigueur</strong>, qui citent leurs sources et expliquent leurs résultats. Aucun compte à créer, aucune donnée transmise — tout se calcule dans votre navigateur.";
F.outilsTitre="Les outils";
F.outilsIntro="Chacun applique les textes officiels en vigueur et affiche le détail de son calcul plutôt qu'un simple résultat.";
F.go="Ouvrir l'outil";F.soon="Bientôt disponible";
F.chiffresTitre="Les chiffres 2026 en vigueur";
F.chiffresIntro="Les valeurs de référence qui alimentent tous les outils du site. Beaucoup de calculateurs en ligne tournent encore sur les barèmes de l'an dernier.";
F.pourquoiTitre="Ce qui distingue ces outils";
F.pourquoiIntro="Trois partis pris, qui expliquent aussi pourquoi certains calculs sont volontairement refusés plutôt qu'approximés.";
F.props=[
 ["01","Les barèmes sont vérifiés, pas recopiés","Chaque valeur est recoupée contre son texte officiel : arrêté, article de code, publication URSSAF. Le SMIC a été revalorisé deux fois en 2026 et la grille du prélèvement à la source n'a changé qu'au 1<sup>er</sup> mai — beaucoup d'outils l'ignorent encore."],
 ["02","Le détail du calcul est montré","Ligne par ligne, cotisation par cotisation, comme sur un bulletin de paie. Un résultat qu'on ne peut pas vérifier ne vaut pas grand-chose, surtout quand il s'agit de votre salaire."],
 ["03","Ce qui n'est pas calculable est signalé","Mayotte relève d'un régime social distinct, la Nouvelle-Calédonie n'est pas couverte par l'URSSAF. Plutôt que d'appliquer des taux qui ne s'appliquent pas, les outils l'annoncent et expliquent pourquoi."]];
F.footer1="— des calculateurs administratifs et fiscaux tenus à jour, sans compte à créer.";
F.footer2="Informations données à titre indicatif, ne remplaçant pas l'avis d'un professionnel. En cas de doute, référez-vous à <a href=\"https://www.urssaf.fr\">urssaf.fr</a>, <a href=\"https://www.service-public.fr\">service-public.fr</a> ou à un expert-comptable.";

N.title="Les Bons Chiffres — French tax and payroll calculators, current for 2026";
N.navOutils="Tools";N.navChiffres="2026 figures";
N.eyebrow="France · Rates verified {dateMaj}";
N.h1="French administrative calculations, done properly";
N.lede="Salary, contributions, tax thresholds: calculators <strong>kept current with the rates actually in force</strong>, citing their sources and explaining their results. No account to create, no data sent — everything is computed in your browser.";
N.outilsTitre="The tools";
N.outilsIntro="Each one applies the official texts in force and shows its working rather than just a figure.";
N.go="Open the tool";N.soon="Coming soon";
N.chiffresTitre="The 2026 figures in force";
N.chiffresIntro="The reference values feeding every tool on the site. Many online calculators still run on last year's rates.";
N.pourquoiTitre="What sets these tools apart";
N.pourquoiIntro="Three principles, which also explain why some calculations are deliberately refused rather than approximated.";
N.props=[
 ["01","Rates are verified, not copied","Every value is checked against its official text: decree, code article, URSSAF publication. The SMIC rose twice in 2026 and the withholding tax grid only changed on 1 May — many tools still miss this."],
 ["02","The working is shown","Line by line, contribution by contribution, the way a payslip does. A result you cannot check is worth very little, especially where your salary is concerned."],
 ["03","What cannot be computed is flagged","Mayotte has a separate social security scheme, New Caledonia falls outside URSSAF. Rather than applying rates that do not apply, the tools say so and explain why."]];
N.footer1="— administrative and tax calculators kept up to date, with no account to create.";
N.footer2="Provided for information only; it does not replace professional advice. If in doubt, refer to <a href=\"https://www.urssaf.fr\">urssaf.fr</a>, <a href=\"https://www.service-public.fr\">service-public.fr</a> or a chartered accountant.";

var lang='fr',L=D.fr;
var $=function(i){return document.getElementById(i);};
function tr(s){return B.remplace(s,lang);}

function chiffres(){
  var l=lang;
  return [
    {k:{fr:"SMIC mensuel brut",en:"Monthly gross SMIC"}[l], v:B.fmt(B.SMIC.mensuel,l,2),
     n:{fr:B.fmt(B.SMIC.horaire,l,2)+" de l'heure depuis le 1<sup>er</sup> juin 2026. Soit "+B.fmt(B.SMIC.netMensuel,l,2)+" net.",
        en:B.fmt(B.SMIC.horaire,l,2)+" an hour since 1 June 2026. That is "+B.fmt(B.SMIC.netMensuel,l,2)+" net."}[l]},
    {k:{fr:"Plafond mensuel SS",en:"Monthly SS ceiling"}[l], v:B.fmt(B.PSS.mensuel,l),
     n:{fr:"Soit "+B.fmt(B.PSS.annuel,l)+" par an. Il était de "+B.fmt(B.PSS.precedent.mensuel,l)+" en 2025.",
        en:"That is "+B.fmt(B.PSS.annuel,l)+" a year. It was "+B.fmt(B.PSS.precedent.mensuel,l)+" in 2025."}[l]},
    {k:{fr:"CSG + CRDS",en:"CSG + CRDS"}[l], v:B.pct(B.COTIS.csgDeductible+B.COTIS.csgNonDeductible+B.COTIS.crds,l),
     n:{fr:"Sur "+B.pct(B.COTIS.abattementCSG*100,l)+" du brut, dont "+B.pct(B.COTIS.csgDeductible,l)+" déductible.",
        en:"On "+B.pct(B.COTIS.abattementCSG*100,l)+" of gross, of which "+B.pct(B.COTIS.csgDeductible,l)+" deductible."}[l]},
    {k:{fr:"Plafond micro, services",en:"Micro cap, services"}[l], v:B.fmt(B.MICRO.plafondService,l),
     n:{fr:"Franchise de TVA jusqu'à "+B.fmt(B.MICRO.tvaBaseService,l)+" de chiffre d'affaires.",
        en:"VAT exemption up to "+B.fmt(B.MICRO.tvaBaseService,l)+" of turnover."}[l]}
  ];
}

function rend(){
  document.documentElement.lang=lang;
  document.title=L.title;
  $('btnFr').setAttribute('aria-pressed',lang==='fr');
  $('btnEn').setAttribute('aria-pressed',lang==='en');

  var a=document.querySelectorAll('[data-i]');
  for(var i=0;i<a.length;i++){var k=a[i].getAttribute('data-i'); if(L[k]!=null) a[i].textContent=tr(L[k]);}
  var b=document.querySelectorAll('[data-ihtml]');
  for(var j=0;j<b.length;j++){var k2=b[j].getAttribute('data-ihtml'); if(L[k2]!=null) b[j].innerHTML=tr(L[k2]);}

  // Les outils sont lus dans baremes.js : en ajouter un là-bas suffit
  $('toolsGrid').innerHTML = B.OUTILS.map(function(o){
    var live=o.etat==='live', bal=live?'a':'span';
    var cible=(lang==='en' && o.urlEn)?o.urlEn:o.url;
    var href=live?' href="'+cible+'"':'';
    return '<'+bal+href+' class="tool'+(live?'':' soon')+'">'
      +'<div class="tk"><span class="dot"></span>'+o.cat[lang]+(live?'':' · '+L.soon)+'</div>'
      +'<div class="tt">'+o.titre[lang]+'</div>'
      +'<div class="td">'+o.desc[lang]+'</div>'
      +(live?'<div class="go">'+L.go+' \u2192</div>':'')
      +'</'+bal+'>';
  }).join('');

  $('figsGrid').innerHTML = chiffres().map(function(f){
    return '<div class="fig"><div class="k">'+f.k+'</div><div class="v">'+f.v+'</div><div class="n">'+f.n+'</div></div>';
  }).join('');

  $('propsGrid').innerHTML = L.props.map(function(p){
    return '<div class="prop"><span class="mark">'+p[0]+'</span><h3>'+p[1]+'</h3><p>'+p[2]+'</p></div>';
  }).join('');

  $('footLinks').innerHTML = B.OUTILS.filter(function(o){return o.etat==='live';})
    .map(function(o){var u=(lang==='en'&&o.urlEn)?o.urlEn:o.url;
      return '<a href="'+u+'">'+o.titre[lang]+'</a>';}).join('');

  if(!window.__ALT__){ try{history.replaceState(null,'',lang==='en'?'?lang=en':location.pathname);}catch(e){} }
}

function versLangue(l){
  var alt=window.__ALT__;
  if(alt && alt[l] && l!==lang){ location.href=alt[l]; return; }
  lang=l; L=D[l]; rend();
}
$('btnFr').addEventListener('click',function(){versLangue('fr');});
$('btnEn').addEventListener('click',function(){versLangue('en');});
var p=new URLSearchParams(location.search).get('lang')
      || window.__LANG__ || document.documentElement.lang;
lang=(p==='en')?'en':'fr'; L=D[lang]; rend();
})();
</script>
</body>
</html>
